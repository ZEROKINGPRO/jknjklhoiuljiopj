<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة الاتصال - شاشة كاملة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;background:#121214;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

.app{width:100vw;height:100vh;height:100dvh;background:#121214;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between}

/* Status Bar */
.status-bar{height:28px;display:flex;justify-content:flex-start;align-items:center;padding:0 16px;font-size:12px;color:#aaa;font-weight:600;flex-shrink:0}

/* Menu Options */
.menu-options{padding:4px 16px;display:flex;flex-direction:column;gap:8px;color:#e1e1e6;font-size:13px;flex-shrink:0}
.menu-item{display:flex;align-items:center;gap:14px;cursor:pointer}
.menu-item svg{width:16px;height:16px;fill:#c4c7c5}

/* Screen Views */
.screen-view{flex:1;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-height:0}
.hidden{display:none!important}

/* Typed Number Area */
.number-display-area{padding:2px 20px;display:flex;align-items:center;justify-content:space-between;height:45px;flex-shrink:0}
.typed-number{font-size:24px;color:#fff;direction:ltr;text-align:left;flex:1;background:transparent;border:0;outline:none;font-family:inherit;padding:0;margin:0}
.typed-number::-webkit-scrollbar{display:none}
.clear-btn{background:none;border:0;color:#c4c7c5;font-size:18px;cursor:pointer;padding:0 5px;flex-shrink:0}

/* Dialpad Container */
.pad-container{padding:0 16px 2px;flex-shrink:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;text-align:center;max-width:300px;margin:0 auto;direction:ltr}
.pad button{background:#1f1f23;border:0;width:60px;height:60px;border-radius:50%;margin:0 auto;color:#fff;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 0.15s;flex-shrink:0}
.pad button:active{background:#38383f}
.pad button span{font-size:8px;color:#9aa0a6;margin-top:1px;letter-spacing:1px}

/* Call Action Area */
.call-action-area{padding:4px 0 10px;display:flex;justify-content:center;align-items:center;flex-shrink:0}
.call-btn{width:130px;height:48px;background:#0f9d58;color:#fff;border:0;border-radius:24px;font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(15,157,88,0.3);flex-shrink:0}
.call-btn:active{transform:scale(0.96)}
.call-btn svg{width:18px;height:18px;fill:#fff}

/* Recents Screen */
.recents-screen{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;text-align:right;direction:rtl}
.recents-screen::-webkit-scrollbar{display:none}
.recents-title{font-size:16px;font-weight:bold;color:#fff;margin-bottom:2px}
.recent-item{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1f1f23}
.recent-info{display:flex;align-items:center;gap:10px}
.recent-avatar{width:34px;height:34px;background:#2b2c30;color:#8ab4f8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px}
.recent-details div:first-child{font-size:13px;color:#e8eaed;font-weight:500}
.recent-details div:last-child{font-size:10px;color:#ea4335;margin-top:1px}
.recent-time{font-size:10px;color:#9aa0a6}

/* Bottom Nav Bar */
.bottom-nav-bar{height:52px;background:#121214;display:flex;justify-content:center;align-items:center;gap:40px;border-top:1px solid #1f1f23;flex-shrink:0}
.nav-tab{background:none;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;color:#9aa0a6;transition:0.2s}
.nav-tab.active{color:#8ab4f8}
.nav-tab svg{width:22px;height:22px;fill:currentColor}
.dialpad-pill{background:#2b2d30;border-radius:18px;width:64px;height:34px;display:flex;align-items:center;justify-content:center}

/* Loading Overlay */
.loading-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center}
.loading-card{background:#202124;border-radius:18px;padding:18px 24px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.spinner{width:24px;height:24px;border:3px solid rgba(255,255,255,0.1);border-top-color:#8ab4f8;border-radius:50%;animation:spin 0.8s linear infinite}
.loading-card span{color:#fff;font-size:14px;font-weight:500}

/* USSD Popup */
.ussd-popup{position:absolute;inset:0;background:rgba(0,0,0,0.65);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.ussd-box{width:100%;max-width:300px;background:#202124;border-radius:16px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,0.6);text-align:right;color:#e8eaed;direction:rtl}
.ussd-text{font-size:12px;line-height:1.5;margin-bottom:14px;white-space:pre-line;color:#e8eaed}
.ussd-input{width:100%;height:38px;background:#303134;border:1px solid #8ab4f8;border-radius:6px;color:#fff;font-size:15px;padding:0 10px;outline:none;margin-bottom:14px;text-align:center;letter-spacing:2px;direction:ltr}
.ussd-buttons{display:flex;justify-content:flex-start;gap:16px}
.ussd-btn{background:none;border:0;color:#8ab4f8;font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px}

/* Notification Banner */
.notif-banner{position:absolute;top:-100px;left:10px;right:10px;background:#2b2c30;border-radius:14px;padding:10px 12px;box-shadow:0 8px 25px rgba(0,0,0,0.6);z-index:250;display:flex;flex-direction:column;gap:4px;transition:top 0.3s ease-in-out;cursor:pointer;direction:rtl;text-align:right}
.notif-banner.show{top:10px}
.notif-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9aa0a6}
.notif-app-name{display:flex;align-items:center;gap:6px;font-weight:600;color:#e8eaed}
.notif-content{font-size:11px;color:#bdc1c6;margin-top:2px;line-height:1.3}

/* SMS App Screen */
.sms-app-screen{position:absolute;inset:0;background:#121214;z-index:300;display:flex;flex-direction:column;direction:rtl;text-align:right}
.sms-app-header{height:48px;background:#1f1f23;display:flex;align-items:center;padding:0 14px;gap:12px;border-bottom:1px solid #2d2d32;flex-shrink:0}
.sms-back-btn{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.sms-sender-info{display:flex;align-items:center;gap:8px}
.sms-avatar{width:30px;height:30px;background:#e60000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px}
.sms-sender-name{font-size:14px;font-weight:500;color:#fff}
.sms-chat-body{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#121214}
.sms-bubble-container{display:flex;flex-direction:column;align-items:flex-start}
.sms-bubble{background:#26262a;color:#e8eaed;padding:8px 12px;border-radius:12px 4px 12px 12px;max-width:85%;font-size:12px;line-height:1.4;word-break:break-word}
.sms-time{font-size:9px;color:#80868b;margin-top:3px;margin-right:3px}

/* Site Lock Screen Overlay */
.site-lock-overlay {
  position: fixed;
  inset: 0;
  background: #121214;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  direction: rtl;
}
.site-lock-card {
  width: 100%;
  max-width: 320px;
  background: #1f1f23;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.7);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.site-lock-title {
  font-size: 18px;
  font-weight: bold;
  color: #fff;
}
.site-lock-desc {
  font-size: 13px;
  color: #9aa0a6;
}
.site-lock-input {
  width: 100%;
  height: 44px;
  background: #121214;
  border: 1px solid #38383f;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  text-align: center;
  outline: none;
  letter-spacing: 3px;
  direction: ltr;
}
.site-lock-input:focus {
  border-color: #8ab4f8;
}
.site-lock-btn {
  width: 100%;
  height: 44px;
  background: #0f9d58;
  border: 0;
  border-radius: 10px;
  color: #fff;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
}
.site-lock-btn:active {
  opacity: 0.85;
}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- شاشة حماية الموقع (الباسورد العام) -->
<div class="site-lock-overlay" id="siteLockOverlay">
  <div class="site-lock-card">
    <div class="site-lock-title">موقع محمي بكلمة مرور</div>
    <div class="site-lock-desc">الرجاء إدخال كلمة المرور الخاصة لفتح الموقع</div>
    <input type="password" class="site-lock-input" id="sitePasswordInput" placeholder="كلمة المرور" autocomplete="off">
    <button class="site-lock-btn" id="siteLoginBtn">دخول</button>
  </div>
</div>

<div class="app">
  <div>
    <div class="status-bar">
      <span id="clock">1:04</span>
    </div>

    <div class="menu-options" id="menuOptions">
      <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>إنشاء جهة اتصال جديدة</div>
      <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>الإضافة إلى جهة اتصال</div>
      <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM15 16H5V8h10v8z"/></svg>مكالمة فيديو</div>
      <div class="menu-item"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>إرسال رسالة</div>
    </div>
  </div>

  <div class="screen-view" id="dialerScreen">
    <div class="number-display-area">
      <input type="text" class="typed-number" id="typedNumber" autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="eraseBtn">⌫</button>
    </div>
    <div>
      <div class="pad-container">
        <div class="pad">
          <button data-k="3">3<span>DEF</span></button>
          <button data-k="2">2<span>ABC</span></button>
          <button data-k="1">1</button>
          <button data-k="6">6<span>MNO</span></button>
          <button data-k="5">5<span>JKL</span></button>
          <button data-k="4">4<span>GHI</span></button>
          <button data-k="9">9<span>WXYZ</span></button>
          <button data-k="8">8<span>TUV</span></button>
          <button data-k="7">7<span>PQRS</span></button>
          <button data-k="#">#</button>
          <button data-k="0">0<span>+</span></button>
          <button data-k="*">*</button>
        </div>
      </div>
      <div class="call-action-area">
        <button class="call-btn" id="callBtn">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          اتصال
        </button>
      </div>
    </div>
  </div>

  <div class="screen-view hidden" id="recentsScreen">
    <div class="recents-screen">
      <div class="recents-title">المكالمات الفائتة</div>
      <div id="recentsListContainer"></div>
    </div>
  </div>

  <div class="bottom-nav-bar">
    <button class="nav-tab" id="homeNavBtn" title="المكالمات الأحدث">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </button>
    <button class="nav-tab active" id="keypadNavBtn" title="لوحة المفاتيح">
      <div class="dialpad-pill">
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#8ab4f8;"><path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2 z"/></svg>
      </div>
    </button>
  </div>

  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-card">
      <div class="spinner"></div>
      <span>جاري تشغيل كود USSD...</span>
    </div>
  </div>

  <div class="ussd-popup hidden" id="ussdPopup">
    <div class="ussd-box">
      <div class="ussd-text" id="ussdMsgText"></div>
      <input type="text" class="ussd-input hidden" id="ussdInputField" autocomplete="off">
      <div class="ussd-buttons">
        <button class="ussd-btn" id="ussdCancelBtn">إلغاء</button>
        <button class="ussd-btn" id="ussdSendBtn">إرسال</button>
      </div>
    </div>
  </div>

  <div class="notif-banner" id="notifBanner">
    <div class="notif-top">
      <span class="notif-app-name">💬 الرسائل • الآن</span>
      <span>التفاصيل</span>
    </div>
    <div class="notif-content" id="notifTextSnippet"></div>
  </div>

  <div class="sms-app-screen hidden" id="smsAppScreen">
    <div class="sms-app-header">
      <button class="sms-back-btn" id="smsBackBtn">→</button>
      <div class="sms-sender-info">
        <div class="sms-avatar">V</div>
        <div class="sms-sender-name">Vodafone</div>
      </div>
    </div>
    <div class="sms-chat-body" id="smsChatBody"></div>
  </div>

</div>

<script>
// كلمة المرور العامة لفتح الموقع (يمكنك تغييرها هنا إلى ما تحب)
const SITE_MASTER_PASSWORD = "90009000";

document.getElementById("siteLoginBtn").onclick = function() {
  const enteredPass = document.getElementById("sitePasswordInput").value;
  if(enteredPass === SITE_MASTER_PASSWORD) {
    document.getElementById("siteLockOverlay").classList.add("hidden");
  } else {
    alert("كلمة مرور الموقع غير صحيحة!");
  }
};

document.getElementById("sitePasswordInput").addEventListener("keypress", function(e) {
  if(e.key === "Enter") {
    document.getElementById("siteLoginBtn").click();
  }
});

let dialText = "";
let transferData = { number: "", amount: "" };
let maskedOwnerName = "";
let currentStep = "password";
const CORRECT_PIN = "900900";

const specificNames = {
  "010446484675": "Ahmed Mohamed Ibrahim"
};

const firstNames = ["Ahmed", "Mohamed", "Mahmoud", "Eslam", "Mostafa", "Karim", "Ali", "Ibrahim", "Hussein", "Omar", "Khaled", "Abdelrahman"];
const middleNames = ["Mohamed", "Ahmed", "Mahmoud", "Ali", "Hassan", "Hussein", "Ibrahim", "Said", "Salah", "Gamal"];
const lastNames = ["Ibrahim", "Hassan", "Ali", "Mahmoud", "Abdallah", "Elmasry", "Selim", "Tawfik", "Shehata", "Osman"];

function formatMaskedName(fullName) {
  const parts = fullName.trim().split(" ");
  if (parts.length === 1) return parts[0];
  let result = parts[0];
  for (let i = 1; i < parts.length; i++) {
    let word = parts[i];
    let maskedWord = word.charAt(0) + "******".substring(0, Math.min(word.length - 1, 6));
    result += " " + maskedWord;
  }
  return result;
}

function generateRandomMaskedName(phone) {
  if (specificNames[phone]) {
    return formatMaskedName(specificNames[phone]);
  }
  let seed = parseInt(phone.slice(-4)) || 123;
  let f = firstNames[seed % firstNames.length];
  let m = middleNames[(seed * 3) % middleNames.length];
  let l = lastNames[(seed * 7) % lastNames.length];
  return formatMaskedName(`${f} ${m} ${l}`);
}

function updateClock(){
  const d = new Date();
  const timeStr = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
  document.getElementById("clock").textContent = timeStr;
  return timeStr;
}
updateClock();
setInterval(updateClock, 1000);

const typedNumberElem = document.getElementById("typedNumber");
function renderDial(){
  typedNumberElem.value = dialText;
}

document.querySelectorAll(".pad button").forEach(btn => {
  btn.onclick = () => {
    dialText += btn.dataset.k;
    renderDial();
  };
});

document.getElementById("eraseBtn").onclick = () => {
  if(dialText.length > 0){
    dialText = dialText.slice(0, -1);
    renderDial();
  }
};

typedNumberElem.addEventListener("input", (e) => {
  dialText = e.target.value;
});

const dialerScreen = document.getElementById("dialerScreen");
const recentsScreen = document.getElementById("recentsScreen");
const menuOptions = document.getElementById("menuOptions");
const homeNavBtn = document.getElementById("homeNavBtn");
const keypadNavBtn = document.getElementById("keypadNavBtn");

const missedCallsList = [
  { name: "Ahmed", time: "منذ 5 دقائق" },
  { name: "Rana", time: "منذ 15 دقيقة" },
  { name: "Ali", time: "منذ ساعة" },
  { name: "Chiko", time: "منذ ساعتين" },
  { name: "Joker", time: "أمس" },
  { name: "Mafia", time: "أمس" },
  { name: "Reno", time: "منذ 3 أيام" },
  { name: "Inov", time: "منذ 4 أيام" },
  { name: "Baba", time: "منذ أسبوع" },
  { name: "Mama", time: "منذ أسبوع" }
];

function populateRecents() {
  const container = document.getElementById("recentsListContainer");
  container.innerHTML = "";
  missedCallsList.forEach(call => {
    container.innerHTML += `
      <div class="recent-item">
        <div class="recent-info">
          <div class="recent-avatar">${call.name.charAt(0)}</div>
          <div class="recent-details">
            <div>${call.name}</div>
            <div>مكالمة فائتة</div>
          </div>
        </div>
        <div class="recent-time">${call.time}</div>
      </div>
    `;
  });
}

homeNavBtn.onclick = () => {
  homeNavBtn.classList.add("active");
  keypadNavBtn.classList.remove("active");
  dialerScreen.classList.add("hidden");
  menuOptions.classList.add("hidden");
  recentsScreen.classList.remove("hidden");
  populateRecents();
};

keypadNavBtn.onclick = () => {
  keypadNavBtn.classList.add("active");
  homeNavBtn.classList.remove("active");
  recentsScreen.classList.add("hidden");
  dialerScreen.classList.remove("hidden");
  menuOptions.classList.remove("hidden");
};

function parseUSSDCode(code){
  const match = code.match(/^\*9\*7\*(\d+)\*(\d+)#$/);
  if(match){
    return { number: match[1], amount: match[2] };
  }
  return null;
}

document.getElementById("callBtn").onclick = () => {
  const parsed = parseUSSDCode(dialText);
  if(!parsed){
    alert("يرجى كتابة كود USSD بالصيغة التالية: *9*7*الرقم*المبلغ#");
    return;
  }
  transferData = parsed;
  maskedOwnerName = generateRandomMaskedName(transferData.number);

  showLoading(() => {
    showPasswordPrompt();
  });
};

function showLoading(callback){
  const loading = document.getElementById("loadingOverlay");
  loading.classList.remove("hidden");
  setTimeout(() => {
    loading.classList.add("hidden");
    if(callback) callback();
  }, 1500);
}

function showPasswordPrompt(){
  currentStep = "password";
  const popup = document.getElementById("ussdPopup");
  const msg = document.getElementById("ussdMsgText");
  const input = document.getElementById("ussdInputField");
  
  msg.textContent = `لتحويل ${transferData.amount} جنيه + 1 جنيه رسوم إلى ${transferData.number}\n(${maskedOwnerName})\nأدخل كلمة المرور الخاصة بك\nالمزيد: 0`;
  input.type = "password";
  input.maxLength = 6;
  input.value = "";
  input.classList.remove("hidden");
  popup.classList.remove("hidden");
  setTimeout(() => input.focus(), 100);
}

document.getElementById("ussdSendBtn").onclick = () => {
  const input = document.getElementById("ussdInputField");
  
  if(currentStep === "password") {
    if(input.value !== CORRECT_PIN){
      alert("كلمة المرور غير صحيحة! (الافتراضية للاختبار: 900900)");
      return;
    }
    document.getElementById("ussdPopup").classList.add("hidden");
    showLoading(() => {
      showSuccessMessage();
    });
  } else if(currentStep === "success") {
    document.getElementById("ussdPopup").classList.add("hidden");
  }
};

function showSuccessMessage(){
  currentStatus = "success";
  const popup = document.getElementById("ussdPopup");
  const msg = document.getElementById("ussdMsgText");
  const input = document.getElementById("ussdInputField");

  msg.textContent = `تم تحويل ${transferData.amount} إلى ${transferData.number} بنجاح\nرسوم الخدمة 1 جنيه. اطلب *9# للشحن\nالمزيد: 0`;
  input.type = "text";
  input.removeAttribute("maxlength");
  input.value = "";
  input.classList.remove("hidden");
  popup.classList.remove("hidden");
  setTimeout(() => input.focus(), 100);

  setTimeout(() => {
    triggerRealSMSNotification(transferData.amount, transferData.number);
  }, 800);
}

function playNotificationSound() {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, time, delay) {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + time);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + time);
      }, delay);
    }
    playTone(880, 0.15, 0);
    playTone(1318.5, 0.25, 180);
  } catch (e) {
    console.log("Audio error");
  }
}

function triggerRealSMSNotification(amount, phone) {
  const banner = document.getElementById("notifBanner");
  const snippet = document.getElementById("notifTextSnippet");
  
  const messageContent = `تم تحويل ${amount} جنيه إلى الرقم ${phone} بنجاح.`;
  snippet.textContent = `Vodafone: ${messageContent}`;
  
  const chatBody = document.getElementById("smsChatBody");
  const currentTime = updateClock();
  chatBody.innerHTML = `
    <div class="sms-bubble-container">
      <div class="sms-bubble">${messageContent}</div>
      <span class="sms-time">اليوم، ${currentTime}</span>
    </div>
  `;

  playNotificationSound();
  banner.classList.add("show");
}

document.getElementById("notifBanner").onclick = () => {
  document.getElementById("notifBanner").classList.remove("show");
  document.getElementById("ussdPopup").classList.add("hidden");
  document.getElementById("smsAppScreen").classList.remove("hidden");
};

document.getElementById("smsBackBtn").onclick = () => {
  document.getElementById("smsAppScreen").classList.add("hidden");
};

document.getElementById("ussdCancelBtn").onclick = () => {
  document.getElementById("ussdPopup").classList.add("hidden");
};
</script>
